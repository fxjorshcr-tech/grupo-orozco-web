<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F4E3A8"/>
      <stop offset="22%"  stop-color="#E3C56A"/>
      <stop offset="48%"  stop-color="#C9A227"/>
      <stop offset="62%"  stop-color="#8A6A1E"/>
      <stop offset="80%"  stop-color="#D9B45A"/>
      <stop offset="100%" stop-color="#F0DCA0"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity=".55"/>
      <stop offset="45%"  stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
