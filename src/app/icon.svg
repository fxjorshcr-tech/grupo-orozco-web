  <rect width="512" height="512" rx="112" fill="#0B0B0C"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#C9A227" stroke-opacity=".28" stroke-width="6"/>

  <!-- "O" del logotipo: anillo grueso en oro metálico -->
  <ellipse cx="256" cy="262" rx="148" ry="160" fill="none" stroke="url(#oro)" stroke-width="70"/>
  <ellipse cx="256" cy="262" rx="148" ry="160" fill="none" stroke="url(#brillo)" stroke-width="70"/>
</svg>
